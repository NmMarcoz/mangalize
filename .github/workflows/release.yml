name: Release

# Tagging is the release trigger: push `v0.2.0` and this builds the installers
# and opens a draft release holding them.
#
# `workflow_dispatch` builds the same artifacts without publishing anything,
# which is the way to check a CI change without burning a version number.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action creates the release and uploads to it.
permissions:
  contents: write

jobs:
  # The tag and the version in tauri.conf.json must agree, or the updater will
  # offer an update that reports a different version than the one it installs.
  # Cheap to check here, confusing to debug later.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf"
            echo "Bump \"version\" in src-tauri/tauri.conf.json to $tag, commit, then re-tag."
            exit 1
          fi
          echo "version $conf matches tag $GITHUB_REF_NAME"

  build:
    needs: [check-version]
    # `always()` lets workflow_dispatch run even though the version check is
    # skipped for anything that is not a tag.
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than separate Intel and Apple Silicon
          # downloads: slightly larger, but nobody has to know which they need.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # `targets: "all"` in tauri.conf.json gets both the .msi and the NSIS
          # .exe here. The .exe is what the updater uses; see updaterJsonPreferNsis.
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Linux would go here:
          #   - platform: ubuntu-22.04
          #     args: ""
          # It also needs a step installing libwebkit2gtk-4.1-dev, libappindicator3-dev,
          # librsvg2-dev and patchelf before the build.

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Tauri's dependency tree is large; without this every release build
      # compiles it from scratch on both runners.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.platform }}

      - run: bun install --frozen-lockfile

      - name: Check
        run: |
          cargo test --workspace
          bun run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts so an installed app will only accept an
          # update that came from this key. Unrelated to OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing and notarisation ---
          # Without these the app installs but Gatekeeper warns on first launch.
          # Uncomment together once an Apple Developer account is set up.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Empty on workflow_dispatch, which makes tauri-action build without
          # creating or touching a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Mangalize ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            - **macOS** — `.dmg`. Unsigned for now, so the first launch needs
              right-click → Open. Updates afterwards are automatic.
            - **Windows** — `.exe` for a normal install, `.msi` if you prefer it.

            The `.sig`, `.tar.gz` and `latest.json` files are what the in-app
            updater reads. You do not need to download them.
          releaseDraft: true
          prerelease: false
          # Both a .msi and an NSIS .exe are built. Without this the updater JSON
          # points at the .msi, whose installer needs elevation and so prompts for
          # UAC on every single update.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Only useful for the build-without-releasing path; on a tag the installers
      # are already attached to the draft release.
      - name: Upload installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mangalize-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
