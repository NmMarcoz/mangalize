name: Release

# Three ways in:
#
#   1. Run this workflow and give it a version (e.g. 1.4.1). CI bumps the version
#      files, commits, tags, builds and publishes. Nothing to do locally.
#   2. Push a `v*` tag yourself. CI builds and publishes that tag.
#   3. Run this workflow with no version. Builds both installers and attaches
#      them as workflow artifacts, without tagging or releasing anything — the
#      way to check a CI change without spending a version number.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.1. Leave empty to build only."
        required: false
        default: ""

# Needed to push the version bump and the tag, and to create the release.
permissions:
  contents: write

jobs:
  # Run before anything is tagged. Publishing is automatic, so a broken commit
  # must never reach a tag: recovering means deleting a pushed tag and a release
  # that users' updaters may already have seen.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace includes the Tauri app, and on Linux Tauri links against
      # the system GTK/WebKit stack. macOS and Windows use their native webviews
      # and need none of this, which is why only this job wants it.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: check
      - run: bun install --frozen-lockfile
      - run: cargo test --workspace
      - run: bun run build
      - run: cargo clippy --all-targets -- -D warnings

  # Turns a version number into a commit and a tag.
  #
  # This deliberately does the tagging in the *same* run that builds, rather than
  # tagging and letting the push trigger a second run: a tag pushed with
  # GITHUB_TOKEN does not trigger another workflow, so that second run would
  # never happen and the release would silently never appear.
  prepare:
    needs: [check]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Tags are not fetched by default, and without them the "already
          # exists" check below silently passes for a version already released.
          fetch-depth: 0
          fetch-tags: true

      - name: Bump, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a three-part version like 1.4.1."
            echo "Tauri's config and the Windows MSI bundler both require major.minor.patch."
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

          # tauri.conf.json is the version the app reports and the updater
          # compares against; Cargo.toml keeps the crates in step.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          # Refresh only the workspace members' own versions in the lockfile.
          cargo update --workspace

          # Cheap insurance: the two files and the tag must agree, or the
          # updater will offer one version and install another.
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$conf" != "$VERSION" ] || [ "$crate" != "$VERSION" ]; then
            echo "::error::bump failed — tauri.conf.json=$conf Cargo.toml=$crate wanted=$VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json Cargo.toml Cargo.lock
          git commit -m "chore: version $VERSION"
          git tag -a "v$VERSION" -m "Mangalize $VERSION"
          git push origin main
          git push origin "v$VERSION"

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # For a tag pushed by hand, the tag and tauri.conf.json must already agree.
  # The prepare job makes them agree by construction, so this only guards path 2.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf"
            echo "Either bump the file and re-tag, or run this workflow with a version instead."
            exit 1
          fi
          echo "version $conf matches tag $GITHUB_REF_NAME"

  build:
    needs: [check, prepare, check-version]
    # `prepare` and `check-version` are each skipped on the paths they do not
    # apply to, so the build runs unless one of them actually failed. `check`
    # always runs and must pass.
    if: |
      always()
      && needs.check.result == 'success'
      && needs.prepare.result != 'failure'
      && needs.check-version.result != 'failure'

    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than separate Intel and Apple Silicon
          # downloads: slightly larger, but nobody has to know which they need.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # `targets: "all"` in tauri.conf.json gets both the .msi and the NSIS
          # .exe here. The .exe is what the updater uses; see updaterJsonPreferNsis.
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Linux would go here:
          #   - platform: ubuntu-22.04
          #     args: ""
          # It needs the same apt step the `check` job runs, plus `patchelf`,
          # which only the AppImage bundler uses.

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # When prepare ran, build the tag it just created rather than whatever
          # main pointed at when this run started.
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Tauri's dependency tree is large; without this every release build
      # compiles it from scratch on both runners.
      #
      # `src-tauri` is a member of the root Cargo workspace, so the target dir is
      # at the repo root and NOT inside src-tauri. Pointing this at the wrong
      # place silently caches nothing.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - run: bun install --frozen-lockfile

      # Re-run the tests per platform. File naming and path handling are where
      # this codebase differs across operating systems, and the gate job only
      # covers Linux.
      - name: Test on this platform
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts so an installed app will only accept an
          # update that came from this key. Unrelated to OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing and notarisation ---
          # Without these the app installs but Gatekeeper warns on first launch.
          # Uncomment together once an Apple Developer account is set up.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Empty on a build-only run, which makes tauri-action build without
          # creating or touching a release.
          tagName: ${{ needs.prepare.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          releaseName: "Mangalize ${{ needs.prepare.outputs.tag || github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            - **macOS** — `.dmg`. Unsigned for now, so the first launch needs
              right-click → Open. Updates afterwards are automatic.
            - **Windows** — `.exe` for a normal install, `.msi` if you prefer it.
            - **Android** — `.apk`, arm64. Sideload it; there is no store
              listing, so the phone will ask you to allow installing from this
              source. Reading and downloading work; building a volume writes it
              to the app's own storage, and the Share button on a built volume
              is how it gets anywhere else.

            The `.sig`, `.tar.gz` and `latest.json` files are what the in-app
            updater reads. You do not need to download them.
          # Published straight away: the updater reads the latest *published*
          # release, so this is what makes an update reach users.
          releaseDraft: false
          prerelease: false
          # Both a .msi and an NSIS .exe are built. Without this the updater JSON
          # points at the .msi, whose installer needs elevation and so prompts for
          # UAC on every single update.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Only useful for the build-without-releasing path; on a release the
      # installers are already attached to the release itself.
      - name: Upload installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mangalize-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe

  # Android is a separate job rather than another entry in the build matrix:
  # tauri-action knows nothing about APKs, the signing is ours, and the runner
  # needs a JDK and an NDK that no desktop platform wants.
  android:
    # After the desktop build rather than beside it, so the release already
    # exists and tauri-action owns its body. Both jobs attaching to the same tag
    # at once means whichever lost would create the release with no notes.
    needs: [check, prepare, check-version, build]
    if: |
      always()
      && needs.check.result == 'success'
      && needs.build.result == 'success'
      && needs.prepare.result != 'failure'
      && needs.check-version.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The Android Gradle Plugin this project generates needs 17 or newer, and
      # the runner's default has been older than that before now.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 only. Every phone sold in years is arm64, and building the
          # other three would triple the time for an APK almost nobody installs.
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android

      # The runner image ships several NDKs. Picking the newest rather than
      # pinning one means this does not break when the image is updated.
      - name: Locate the NDK
        run: |
          set -euo pipefail
          ndk=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          if [ -z "$ndk" ]; then
            echo "::error::no NDK in $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using $ndk"

      - run: bun install --frozen-lockfile

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "Add it with: base64 -i release.jks | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The same script used locally, so a CI build and a developer's build go
      # through one path and cannot drift apart in how they are signed.
      - name: Build and sign
        env:
          MANGALIZE_KEYSTORE: ${{ runner.temp }}/release.jks
          MANGALIZE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MANGALIZE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Nothing to read here; the credentials above are the whole of it.
          MANGALIZE_KEYSTORE_PROPERTIES: /nonexistent
        run: scripts/android.sh

      - name: Name it after the version
        id: apk
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          out="target/Mangalize_${version}_arm64.apk"
          mv target/mangalize-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # The desktop build's release is created by tauri-action, which runs in a
      # different job. Attaching here rather than creating means whichever
      # finishes second adds to the release the first one made.
      - name: Attach to the release
        if: ${{ needs.prepare.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false

      - name: Upload the APK as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mangalize-android
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}
