[package]
name = "leaf-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "leaf_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
leaf-core = { path = "../crates/leaf-core" }
leaf-meta = { path = "../crates/leaf-meta" }
leaf-library = { path = "../crates/leaf-library" }
leaf-fetch = { path = "../crates/leaf-fetch" }
leaf-extensions = { path = "../crates/leaf-extensions" }
leaf-send = { path = "../crates/leaf-send" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
serde.workspace = true
serde_json.workspace = true
image.workspace = true
anyhow.workspace = true

# Only Android needs it, for the self-update that platform has no plugin for.
# Left unconditional because the workspace already builds it for the fetch and
# metadata crates, so this costs nothing on a desktop build.
ureq.workspace = true

# Desktop only, for two different reasons.
#
# `keyring` has no Android backend to speak to, and enabling its Linux one would
# drag in secret-service and its dbus system libraries for a platform we do not
# ship. Sending is gated to match — see `send.rs`.
#
# `tauri-plugin-updater` has no Android implementation at all: a mobile app
# updates through whatever store installed it. Naming its permissions in a
# shared capability is what broke the first Android build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
] }
tauri-plugin-updater = "2.11.0"
