[workspace]
resolver = "2"
members = ["crates/mangalize-core", "crates/mangalize-meta", "crates/mangalize-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }

# Image encoding in the test fixtures is unusably slow when `image` is built
# unoptimised. Our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2
