[workspace]
resolver = "2"
members = [
    "crates/mangalize-core",
    "crates/mangalize-meta",
    "crates/mangalize-library",
    "crates/mangalize-fetch",
    "crates/mangalize-send",
    "crates/mangalize-cli",
    "src-tauri",
]

[workspace.package]
version = "1.7.0"
edition = "2021"
license = "MIT"
# The pinned `image` version needs this. Stating it turns a confusing mid-build
# failure into a clear message naming the required toolchain.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
# `bundled` compiles SQLite itself, so the library file behaves identically on
# every machine regardless of what the OS happens to ship.
rusqlite = { version = "0.37", features = ["bundled"] }

# Image encoding in the test fixtures is unusably slow when `image` is built
# unoptimised. Our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2
